name: Rich Messages Portable Windows x64

on:
  push:
    branches:
      - feature/rich-messages-port
    paths:
      - .github/workflows/rich-messages-windows.yml
  pull_request:
    branches:
      - dev
    paths:
      - .github/workflows/rich-messages-windows.yml
      - .gitmodules
      - docs/building-win.md
      - Telegram/**
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO_NAME: AyuGramDesktop
  PREPARE_PATH: Telegram/build/prepare/prepare.py
  SDK: 10.0.26100.0
  TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
  TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}

jobs:
  build-portable-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 180

    defaults:
      run:
        shell: cmd

    steps:
      - name: Validate Telegram API credentials
        run: |
          if "%TDESKTOP_API_ID%"=="" (
            echo Missing repository secret TDESKTOP_API_ID.
            echo Add it in Settings ^> Secrets and variables ^> Actions ^> New repository secret.
            exit /b 2
          )
          if "%TDESKTOP_API_HASH%"=="" (
            echo Missing repository secret TDESKTOP_API_HASH.
            echo Add it in Settings ^> Secrets and variables ^> Actions ^> New repository secret.
            exit /b 2
          )
          echo Telegram API credentials are present.

      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Clone integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/rich-messages-port
          submodules: recursive
          fetch-depth: 1
          path: TBuild\AyuGramDesktop

      - name: Prepare cache key
        shell: bash
        run: |
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          {
            sha256sum "$TBUILD/$REPO_NAME/$PREPARE_PATH"
            echo "$SDK"
          } > CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> "$GITHUB_ENV"

      - name: Native Tools Command Prompt
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: 14.44

      - name: Configure NuGet
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Restore ThirdParty cache
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: Windows-x64-third-party-${{ env.CACHE_KEY }}
          restore-keys: Windows-x64-third-party-

      - name: Restore libraries cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: Windows-x64-libs-${{ env.CACHE_KEY }}
          restore-keys: Windows-x64-libs-

      - name: Restore Qt cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: Windows-x64-qt6-${{ env.CACHE_KEY }}
          restore-keys: Windows-x64-qt6-

      - name: Build dependencies
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent qt6

      - name: Configure and build AyuGram Release
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          x64 ^
          qt6 ^
          -D TDESKTOP_API_ID=%TDESKTOP_API_ID% ^
          -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

          cmake --build ..\out --config Release --parallel

      - name: Assemble portable package
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Release
          set PORTABLE=%GITHUB_WORKSPACE%\portable\AyuGram-RichMessages-Portable

          mkdir "%PORTABLE%"
          mkdir "%PORTABLE%\tdata"

          if exist "%OUT%\AyuGram.exe" copy "%OUT%\AyuGram.exe" "%PORTABLE%\AyuGram.exe"
          if not exist "%PORTABLE%\AyuGram.exe" if exist "%OUT%\Telegram.exe" copy "%OUT%\Telegram.exe" "%PORTABLE%\AyuGram.exe"
          if exist "%OUT%\Updater.exe" copy "%OUT%\Updater.exe" "%PORTABLE%\Updater.exe"

          echo @echo off> "%PORTABLE%\RUN_PORTABLE.bat"
          echo cd /d "%%~dp0">> "%PORTABLE%\RUN_PORTABLE.bat"
          echo start "" "%%~dp0AyuGram.exe" -workdir "%%~dp0tdata">> "%PORTABLE%\RUN_PORTABLE.bat"

          echo AyuGram Desktop 7.0.3 Rich Messages Portable> "%PORTABLE%\README-PORTABLE.txt"
          echo.>> "%PORTABLE%\README-PORTABLE.txt"
          echo Запуск: RUN_PORTABLE.bat>> "%PORTABLE%\README-PORTABLE.txt"
          echo Данные аккаунта лежат рядом в папке tdata и не смешиваются с обычным Telegram/AyuGram.>> "%PORTABLE%\README-PORTABLE.txt"
          echo Автообновление и crash reports отключены на уровне сборки.>> "%PORTABLE%\README-PORTABLE.txt"
          echo.>> "%PORTABLE%\README-PORTABLE.txt"
          echo Проверить после входа: получение статьи, создание статьи, редактирование статьи, ghost mode, anti-recall, message history, filters.>> "%PORTABLE%\README-PORTABLE.txt"

          if not exist "%PORTABLE%\AyuGram.exe" (
            echo AyuGram executable was not found in build output.
            dir "%OUT%"
            exit /b 3
          )

      - name: Upload portable package
        uses: actions/upload-artifact@v7
        with:
          name: AyuGram-RichMessages-Portable-Windows-x64
          path: portable\AyuGram-RichMessages-Portable\